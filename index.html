<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split Ledger">
<meta name="theme-color" content="#1e3a5f">
<title>Split Ledger</title>
<style>
:root{--navy:#1e3a5f;--teal:#0f9d8a;--red:#dc2626;--bg:#f4f6fa;--ink:#1f2937;--muted:#6b7280}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35}
.top{position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.08)}
header{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 8px 10px;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:space-between}
header .ico{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
header .title{flex:1;text-align:center}
.tripbar{background:#fff;padding:8px 12px;border-bottom:1px solid #e5e7eb}
.tripbar select{min-height:44px}
main{max-width:640px;margin:0 auto;padding:12px 12px calc(110px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h3{margin:0 0 10px;color:var(--navy);font-size:18px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;min-height:48px;padding:12px;font-size:16px;border:1px solid #d1d5db;border-radius:12px;background:#fff;color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0}
input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;flex:0 0 auto}
button{background:var(--teal);color:#fff;border:0;border-radius:12px;min-height:48px;padding:12px 16px;font-size:17px;font-weight:600;width:100%;margin-top:12px;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.6;cursor:wait}
button.sm{width:auto;min-height:40px;margin:0;padding:8px 14px;font-size:15px;border-radius:10px}
button.del{background:none;color:var(--red);width:auto;min-height:44px;margin:0;padding:8px 10px;font-size:15px}
button.ghost{background:#eef2f7;color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;min-height:56px;padding:12px 0;border-bottom:1px solid #eef0f4;gap:8px}
.row>div,.row>span:first-child{flex:1;min-width:0;word-wrap:break-word}
.row small{display:block;color:var(--muted);font-size:14px}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.acts button{width:auto;margin:0}
.pos{color:var(--teal);font-weight:700}.neg{color:var(--red);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chips label{margin:0;background:#eef2f7;color:var(--ink);min-height:44px;padding:10px 14px;border-radius:22px;font-size:16px;display:flex;gap:8px;align-items:center}
.chipbar{width:100%;display:flex;gap:10px;margin:2px 0 6px}
.chipbar button{flex:1;margin:0}
.lnk{font-size:15px;color:var(--navy);display:inline-block;padding:6px 0}
.hint{font-size:14px;color:var(--muted);margin-top:6px;min-height:0}
.editbanner{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 12px;font-weight:600;margin-bottom:8px}
.codebox{margin-top:12px;background:#ecfdf5;border-radius:12px;padding:14px;font-size:16px}
code{font-size:15px;word-break:break-all}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;margin:0;border-radius:0;background:#fff;color:var(--muted);min-height:60px;padding:6px 2px;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--navy);font-weight:700}
.hide{display:none!important}
#toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);background:#1f2937;color:#fff;padding:14px 20px;border-radius:14px;font-size:16px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:20;pointer-events:none;width:max-content;max-width:90vw;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--teal)}
#toast.err{background:var(--red)}
#toast.busy{background:var(--navy)}
</style>
</head>
<body>

<div class="top">
  <header>
    <span class="ico"></span>
    <span class="title">💸 Split Ledger</span>
    <span class="ico" onclick="load()">⟳</span>
  </header>
  <div class="tripbar"><select id="tripSel" onchange="pickTrip(this.value)"></select></div>
</div>

<div id="toast"></div>

<main>

<div id="login" class="card hide">
  <h3>Enter your code</h3>
  <label>Your personal code (from the admin)</label>
  <input id="code" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false">
  <button onclick="login()">Continue</button>
</div>

<div id="p-add" class="page hide">
  <div class="card">
    <h3 id="formTitle">New expense</h3>
    <div id="editBanner" class="editbanner hide"></div>
    <label>Description</label><input id="desc" placeholder="Dinner, fuel, hotel...">
    <label>Amount ($)</label><input id="amt" type="number" inputmode="decimal" step="0.01">
    <label>Date</label><input id="date" type="date">
    <label>Paid by</label><select id="paidBy"></select>
    <label>Category</label>
    <select id="cat">
      <option>General</option><option>Travel</option><option>Food</option>
      <option>Lodging</option><option>Fuel</option><option>Supplies</option>
    </select>
    <label>Receipt photo (optional)</label>
    <input id="receipt" type="file" accept="image/*">
    <div id="receiptNote" class="hint"></div>
    <label id="partLabel">Split between</label>
    <div id="parts" class="chips"></div>
    <button id="saveBtn" data-idle="Save expense" onclick="saveExpense(this)">Save expense</button>
    <button id="cancelEdit" class="ghost hide" onclick="cancelEdit()">Cancel edit</button>
  </div>
</div>

<div id="p-bal" class="page hide">
  <div class="card"><h3>Who owes what</h3><div id="balList"></div></div>
  <div class="card"><h3>Settle up (fewest payments)</h3><div id="settleList"></div></div>
</div>

<div id="p-hist" class="page hide">
  <div class="card"><h3>Expenses</h3><div id="histList"></div></div>
</div>

<div id="p-trips" class="page hide">
  <div class="card"><h3>Trips</h3><div id="tripList"></div></div>
  <div class="card adminOnly">
    <h3>New trip</h3>
    <label>Name</label><input id="tName" placeholder="Atlanta conference">
    <label>Type</label>
    <select id="tType"><option>Business</option><option>Personal</option></select>
    <label>Start date</label><input id="tStart" type="date">
    <label>Members on this trip</label>
    <div id="tMembers" class="chips"></div>
    <button onclick="createTrip(this)">Create trip</button>
  </div>
  <div class="card adminOnly">
    <h3>Edit members of selected trip</h3>
    <div id="rosterChips" class="chips"></div>
    <button onclick="saveRoster(this)">Save roster</button>
  </div>
  <div class="card adminOnly">
    <h3>Member codes for this trip</h3>
    <small style="color:var(--muted)">Tap Copy and send each code privately, one person at a time. Only you can see these codes.</small>
    <div id="tripCodes" style="margin-top:8px"></div>
  </div>
</div>

<div id="p-mem" class="page hide">
  <div class="card adminOnly">
    <h3>Add person</h3>
    <label>Name</label><input id="mName" placeholder="Full name">
    <button onclick="addMember(this)">Create and get code</button>
    <div id="newCode"></div>
  </div>
  <div class="card"><h3>Everyone</h3><div id="memList"></div></div>
  <div class="card"><button class="ghost" onclick="logout()">Log out on this device</button></div>
</div>

</main>

<nav>
  <button data-p="add" class="on" onclick="show('add')"><span class="ic">➕</span>Add</button>
  <button data-p="bal" onclick="show('bal')"><span class="ic">⚖️</span>Balances</button>
  <button data-p="hist" onclick="show('hist')"><span class="ic">🧾</span>History</button>
  <button data-p="trips" onclick="show('trips')"><span class="ic">✈️</span>Trips</button>
  <button data-p="mem" onclick="show('mem')"><span class="ic">👥</span>People</button>
</nav>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxheRnoxOQ0xR2YB6KIC2_LBtQzb9KNlay1W4Bqdhk7AAAH3DunGvo28EcdKxePmXBMFg/exec';
const APP_URL = 'https://mtgstore.github.io/Split-Ledger-Trips/';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cents = x => Math.round(Number(x) * 100);
const money = c => (c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toFixed(2);
const today = () => new Date().toLocaleDateString('en-CA');

let S = { me: null, members: [], trips: [], tripMembers: [], expenses: [], splits: [] };
let codeStore = localStorage.getItem('sl_code') || '';
let tripId = localStorage.getItem('sl_trip') || '';
let currentPage = 'add';
let partSel = null; // null = everyone on the trip is checked; otherwise a Set of MemberIDs
let editId = null;  // ExpenseID being edited, or null when adding a new expense

const nameOf = id => (S.members.find(m => m.MemberID === id) || {}).Name || (id === 'ADMIN' ? 'Admin' : id);
const isAdmin = () => !!(S.me && S.me.admin);
const tripMems = () => S.tripMembers.filter(x => x.TripID === tripId).map(x => x.MemberID);
const tripExp = () => S.expenses.filter(x => x.TripID === tripId);
const tripName = () => (S.trips.find(t => t.TripID === tripId) || {}).Name || 'your trip';
const canEdit = e => isAdmin() || (e.EnteredBy === S.me.MemberID && e.Category !== 'Settlement');

// ---------- STATUS BANNER ----------
function toast(msg, kind = 'ok', ms = 2500) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + kind;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = ''; }, ms);
}
function hideToast() { $('toast').className = ''; }

// Disables the button, shows a busy banner, then a success or error banner.
async function run(btn, busyText, doneText, fn) {
  const oldText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = busyText; }
  toast(busyText, 'busy', 30000);
  try {
    await fn();
    toast(doneText, 'ok');
  } catch (err) {
    toast('Not saved: ' + err.message, 'err', 4500);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.idle || oldText; }
  }
}

function show(p) {
  currentPage = p;
  document.querySelectorAll('.page').forEach(x => x.classList.add('hide'));
  $('login').classList.add('hide');
  if (p === 'login') { $('login').classList.remove('hide'); return; }
  $('p-' + p).classList.remove('hide');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  window.scrollTo(0, 0);
}

function login() {
  codeStore = $('code').value.trim().toUpperCase();
  localStorage.setItem('sl_code', codeStore);
  load();
}

function logout() {
  localStorage.removeItem('sl_code');
  codeStore = '';
  partSel = null;
  resetForm();
  hideToast();
  show('login');
}

async function load(silent = false) {
  if (!codeStore) { show('login'); return; }
  if (!silent) toast('Loading…', 'busy', 15000);
  try {
    const r = await fetch(API_URL + '?code=' + encodeURIComponent(codeStore));
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    S = j;
    if (!S.trips.find(t => t.TripID === tripId)) tripId = S.trips.length ? S.trips[0].TripID : '';
    localStorage.setItem('sl_trip', tripId);
    render();
    show(currentPage);
    if (!silent) toast('Up to date ✓', 'ok', 1500);
  } catch (err) {
    if (String(err.message).includes('Invalid code')) {
      localStorage.removeItem('sl_code');
      codeStore = '';
      show('login');
    }
    toast('Could not load: ' + err.message, 'err', 4500);
  }
}

async function api(action, payload) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ code: codeStore, action, ...payload })
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function pickTrip(id) {
  if (editId) resetForm();
  tripId = id;
  partSel = null; // a new trip starts with everyone checked
  localStorage.setItem('sl_trip', id);
  render();
}

// Net per person in cents. Positive = gets back, negative = owes.
function balances() {
  const net = {};
  const add = (id, v) => { net[id] = (net[id] || 0) + v; };
  tripMems().forEach(id => add(id, 0));
  tripExp().forEach(e => add(e.PaidBy, cents(e.Amount)));
  S.splits.filter(s => s.TripID === tripId).forEach(s => add(s.MemberID, -cents(s.Share)));
  return net;
}

// Greedy settle-up: fewest payments that clear every balance.
function settle(net) {
  const debt = [], cred = [];
  Object.entries(net).forEach(([id, v]) => {
    if (v < 0) debt.push({ id, v: -v });
    if (v > 0) cred.push({ id, v });
  });
  const result = [];
  let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const amt = Math.min(debt[i].v, cred[j].v);
    result.push({ from: debt[i].id, to: cred[j].id, amt });
    debt[i].v -= amt;
    cred[j].v -= amt;
    if (debt[i].v === 0) i++;
    if (cred[j].v === 0) j++;
  }
  return result;
}

function render() {
  $('tripSel').innerHTML = S.trips.length
    ? S.trips.map(t => `<option value="${esc(t.TripID)}" ${t.TripID === tripId ? 'selected' : ''}>${esc(t.Name)} (${esc(t.Type)})</option>`).join('')
    : '<option value="">No trips yet. Create one in Trips.</option>';
  document.querySelectorAll('.adminOnly').forEach(el => el.classList.toggle('hide', !isAdmin()));
  renderAdd(); renderBal(); renderHist(); renderTrips(); renderTripCodes(); renderPeople();
}

function renderAdd() {
  const ids = tripMems();
  const pool = isAdmin() ? ids : [S.me.MemberID];
  const oldPayer = $('paidBy').value;

  $('paidBy').innerHTML = pool.map(id => `<option value="${esc(id)}">${esc(nameOf(id))}</option>`).join('');
  if (oldPayer && pool.includes(oldPayer)) $('paidBy').value = oldPayer;
  else if (pool.includes(S.me.MemberID)) $('paidBy').value = S.me.MemberID;
  $('paidBy').disabled = !isAdmin();

  // Only keep people who are still on this trip in the selection
  if (partSel) partSel = new Set([...partSel].filter(id => ids.includes(id)));
  const checkedCount = ids.filter(id => !partSel || partSel.has(id)).length;

  $('partLabel').textContent = `Split between (${checkedCount} of ${ids.length} selected)`;
  $('parts').innerHTML = ids.length
    ? `<div class="chipbar"><button type="button" class="sm ghost" onclick="setParts(true)">Select all</button><button type="button" class="sm ghost" onclick="setParts(false)">Clear</button></div>` +
      ids.map(id => `<label><input type="checkbox" value="${esc(id)}" ${(!partSel || partSel.has(id)) ? 'checked' : ''}>${esc(nameOf(id))}</label>`).join('')
    : '<small>No members on this trip yet</small>';
}

// Select all or clear the split group, then refresh the count
function setParts(on) {
  partSel = on ? new Set(tripMems()) : new Set();
  renderAdd();
}

// Remember the group the user ticks so it carries over to the next expense
$('parts').addEventListener('change', () => {
  const ids = tripMems();
  partSel = new Set([...document.querySelectorAll('#parts input:checked')].map(i => i.value));
  $('partLabel').textContent = `Split between (${ids.filter(id => partSel.has(id)).length} of ${ids.length} selected)`;
});

function renderBal() {
  const b = balances();
  $('balList').innerHTML = Object.keys(b).map(id =>
    `<div class="row"><span>${esc(nameOf(id))}</span><span class="${b[id] >= 0 ? 'pos' : 'neg'}">${b[id] >= 0 ? 'gets back ' : 'owes '}${money(Math.abs(b[id]))}</span></div>`
  ).join('') || '<small>No expenses yet</small>';

  const plan = settle(b);
  $('settleList').innerHTML = plan.length
    ? plan.map(p => {
        const mine = isAdmin() || p.from === S.me.MemberID;
        return `<div class="row"><div><b>${esc(nameOf(p.from))}</b> pays <b>${esc(nameOf(p.to))}</b><small>${money(p.amt)}</small></div>${mine ? `<button class="sm" onclick="settleUp(this,'${esc(p.from)}','${esc(p.to)}',${p.amt})">Mark paid</button>` : ''}</div>`;
      }).join('')
    : '<small>Everyone is square ✅</small>';
}

function renderHist() {
  $('histList').innerHTML = [...tripExp()].reverse().map(e => {
    const mine = isAdmin() || e.EnteredBy === S.me.MemberID;
    const editable = canEdit(e);
    const id = esc(e.ExpenseID);
    return `<div class="row">
      <div><b>${esc(e.Description)}</b>
        <small>${esc(e.Date)} · ${esc(nameOf(e.PaidBy))} paid ${money(cents(e.Amount))} · ${esc(e.Category)} · added by ${esc(nameOf(e.EnteredBy))}</small>
        ${e.ReceiptURL ? `<a class="lnk" href="${esc(e.ReceiptURL)}" target="_blank" rel="noopener">📎 Receipt</a>` : ''}
      </div>
      ${(editable || mine) ? `<div class="acts">
        ${editable ? `<button class="sm ghost" onclick="editExp('${id}')">Edit</button>` : ''}
        ${mine ? `<button class="del" onclick="delExp(this,'${id}')">Delete</button>` : ''}
      </div>` : ''}
    </div>`;
  }).join('') || '<small>No expenses yet</small>';
}

function renderTrips() {
  $('tripList').innerHTML = S.trips.map(t => {
    const count = S.tripMembers.filter(x => x.TripID === t.TripID).length;
    return `<div class="row" style="cursor:pointer" onclick="pickTrip('${esc(t.TripID)}')">
      <div><b>${esc(t.Name)}</b><small>${esc(t.Type)} · ${esc(t.StartDate || 'no date')} · ${count} people</small></div>
      ${t.TripID === tripId ? '<span class="pos">Selected</span>' : ''}
    </div>`;
  }).join('') || '<small>No trips yet</small>';

  $('tMembers').innerHTML = S.members.map(m =>
    `<label><input type="checkbox" class="tm" value="${esc(m.MemberID)}" checked>${esc(m.Name)}</label>`).join('');
  $('rosterChips').innerHTML = S.members.map(m => {
    const on = S.tripMembers.some(x => x.TripID === tripId && x.MemberID === m.MemberID);
    return `<label><input type="checkbox" class="rm" value="${esc(m.MemberID)}" ${on ? 'checked' : ''}>${esc(m.Name)}</label>`;
  }).join('');
}

// Admin-only: one row per person on the selected trip, each with a Copy button.
function renderTripCodes() {
  if (!isAdmin()) return;
  const people = tripMems().map(id => S.members.find(m => m.MemberID === id)).filter(Boolean);
  $('tripCodes').innerHTML = people.map(m =>
    `<div class="row">
      <div><b>${esc(m.Name)}</b><small>Code: <code>${esc(m.Code || '')}</code></small></div>
      <button class="sm ghost" data-id="${esc(m.MemberID)}" onclick="copyInvite(this)">Copy</button>
    </div>`
  ).join('') || '<small>Pick members for this trip above, then save the roster.</small>';
}

function renderPeople() {
  $('memList').innerHTML = S.members.map(m =>
    `<div class="row"><div><b>${esc(m.Name)}</b>${m.Code ? `<small>Code: <code>${esc(m.Code)}</code></small>` : ''}</div></div>`
  ).join('') || '<small>No people yet</small>';
}

// ---------- COPY HELPERS ----------
function inviteText(m) {
  return `Hi ${m.Name}, you're invited to ${tripName()} on Split Ledger.\nOpen: ${APP_URL}\nYour code: ${m.Code}`;
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    // Fallback for older Safari/Chrome contexts
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
}

async function copyInvite(btn) {
  const m = S.members.find(x => x.MemberID === btn.dataset.id);
  if (!m || !m.Code) { toast('No code for this person', 'err', 3000); return; }
  await copyToClipboard(inviteText(m));
  toast('Copied for ' + m.Name + ' ✅', 'ok', 2000);
}

// ---------- EDIT MODE ----------
function editExp(id) {
  const e = S.expenses.find(x => x.ExpenseID === id);
  if (!e) { toast('Expense not found', 'err', 3000); return; }

  editId = id;
  $('desc').value = e.Description;
  $('amt').value = Number(e.Amount).toFixed(2);
  $('date').value = e.Date || today();

  // Make sure a category like "Settlement" is still selectable
  if (![...$('cat').options].some(o => o.value === e.Category)) $('cat').add(new Option(e.Category, e.Category));
  $('cat').value = e.Category || 'General';

  partSel = new Set(S.splits.filter(s => s.ExpenseID === id).map(s => s.MemberID));
  renderAdd();
  if (isAdmin()) $('paidBy').value = e.PaidBy;

  $('receipt').value = '';
  $('receiptNote').textContent = e.ReceiptURL ? 'Current receipt is kept unless you pick a new photo.' : '';
  $('formTitle').textContent = 'Edit expense';
  $('editBanner').textContent = `Editing: ${e.Description}`;
  $('editBanner').classList.remove('hide');
  $('cancelEdit').classList.remove('hide');
  $('saveBtn').dataset.idle = 'Update expense';
  $('saveBtn').textContent = 'Update expense';
  show('add');
}

function resetForm() {
  editId = null;
  $('desc').value = '';
  $('amt').value = '';
  $('date').value = today();
  $('receipt').value = '';
  $('receiptNote').textContent = '';
  $('formTitle').textContent = 'New expense';
  $('editBanner').classList.add('hide');
  $('cancelEdit').classList.add('hide');
  $('saveBtn').dataset.idle = 'Save expense';
  $('saveBtn').textContent = 'Save expense';
}

function cancelEdit() {
  resetForm();
  renderAdd();
  toast('Edit cancelled', 'ok', 1800);
}

// ---------- ACTIONS ----------
async function saveExpense(btn) {
  const desc = $('desc').value.trim();
  const amt = parseFloat($('amt').value);
  const people = [...document.querySelectorAll('#parts input:checked')].map(i => i.value);
  if (!tripId) { toast('Create or pick a trip first', 'err', 4000); return; }
  if (!desc || !(amt > 0) || !people.length) {
    toast('Add a description, an amount, and at least one person', 'err', 4000);
    return;
  }
  const total = cents(amt);
  const base = Math.floor(total / people.length);
  const extra = total - base * people.length; // leftover pennies go to the first people
  const shares = people.map((id, i) => ({ memberId: id, share: (base + (i < extra ? 1 : 0)) / 100 }));

  const editing = !!editId;
  const idToEdit = editId;

  await run(btn, editing ? 'Updating…' : 'Saving…', editing ? 'Expense updated ✅' : 'Expense saved ✅', async () => {
    const f = $('receipt').files[0];
    const receipt = f ? await compress(f) : null;
    const payload = {
      tripId, date: $('date').value || today(), description: desc,
      paidBy: $('paidBy').value, amount: total / 100,
      category: $('cat').value, shares, receipt
    };
    if (editing) await api('updateExpense', { ...payload, id: idToEdit });
    else await api('addExpense', payload);

    resetForm();
    show('bal');
    await load(true);
  });
}

// Shrinks phone photos before upload so they save fast and fit the limit.
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', 0.8).split(',')[1];
      URL.revokeObjectURL(url);
      resolve({ name: (file.name || 'receipt').replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
    img.src = url;
  });
}

async function settleUp(btn, from, to, amtCents) {
  if (!confirm(`Record ${nameOf(from)} paying ${nameOf(to)} ${money(amtCents)}?`)) return;
  await run(btn, 'Recording…', 'Payment recorded ✅', async () => {
    await api('addExpense', {
      tripId, date: today(),
      description: `Settle: ${nameOf(from)} → ${nameOf(to)}`,
      paidBy: from, amount: amtCents / 100, category: 'Settlement',
      shares: [{ memberId: to, share: amtCents / 100 }]
    });
    await load(true);
  });
}

async function delExp(btn, id) {
  if (!confirm('Delete this expense?')) return;
  await run(btn, 'Deleting…', 'Expense deleted 🗑️', async () => {
    await api('deleteExpense', { id });
    if (editId === id) resetForm();
    await load(true);
  });
}

async function createTrip(btn) {
  const name = $('tName').value.trim();
  if (!name) { toast('Name the trip first', 'err', 3000); return; }
  const memberIds = [...document.querySelectorAll('.tm:checked')].map(i => i.value);
  await run(btn, 'Creating trip…', 'Trip created ✅', async () => {
    const r = await api('createTrip', { name, type: $('tType').value, startDate: $('tStart').value, memberIds });
    tripId = r.tripId;
    partSel = null;
    $('tName').value = '';
    await load(true);
  });
}

async function saveRoster(btn) {
  if (!tripId) { toast('Pick a trip first', 'err', 3000); return; }
  const memberIds = [...document.querySelectorAll('.rm:checked')].map(i => i.value);
  await run(btn, 'Saving roster…', 'Roster saved ✅', async () => {
    await api('setTripMembers', { tripId, memberIds });
    await load(true);
  });
}

async function addMember(btn) {
  const name = $('mName').value.trim();
  if (!name) { toast('Type a name first', 'err', 3000); return; }
  await run(btn, 'Adding…', 'Member added ✅', async () => {
    const r = await api('createMember', { name });
    $('newCode').innerHTML = `<div class="codebox">${esc(name)}'s code: <b>${esc(r.code)}</b><br><small>Copy it from the Trips page or the People list.</small></div>`;
    $('mName').value = '';
    await load(true);
  });
}

$('date').value = today();
load();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Split Ledger">
<meta name="theme-color" content="#1fa085">
<title>Split Ledger</title>
<style>
:root{--g:#1fa085;--gd:#128a70;--red:#d4500f;--ink:#1a1a1a;--muted:#6b7280;--line:#ececec;--purple:#7c4dcc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:#fff;color:var(--ink);font-size:16px;line-height:1.35}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
input,select{font-family:inherit}
small{display:block;color:var(--muted);font-size:14px}
b{font-weight:700}
.g{color:var(--g)}
.r{color:var(--red)}
.hide{display:none!important}
.scr{min-height:100vh;padding-bottom:110px}
.top{position:sticky;top:0;z-index:10;background:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;min-height:64px;border-bottom:1px solid var(--line)}
.top .ttl{flex:1;font-size:19px;font-weight:700;text-align:center}
.top .sp{width:44px;flex:0 0 44px}
.round{width:44px;height:44px;min-width:44px;border-radius:22px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);padding:0;flex:0 0 auto}
.acts2{display:flex;gap:6px;justify-content:flex-end;min-width:44px}
.hero{background:linear-gradient(160deg,#25b394,var(--gd));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 22px}
.gtop{display:flex;justify-content:space-between;margin-bottom:22px}
.hero .round{background:rgba(255,255,255,.22);border:0;color:#fff}
.hero h2{font-size:30px;margin:0 0 14px;line-height:1.15}
.pill{display:inline-block;background:rgba(0,0,0,.22);border-radius:20px;padding:6px 12px;font-size:14px;margin:0 6px 6px 0}
.sumline{padding:14px 16px;font-size:18px;font-weight:600;border-bottom:1px solid var(--line)}
.sumline span{font-weight:800}
.bals{margin-top:6px}
.brow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.bals .brow{padding:8px 0;border:0}
.brow .grow{flex:1;min-width:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}

.grow{flex:1;min-width:0;word-wrap:break-word}

.right{text-align:right;flex:0 0 auto}

.av{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:16px}

.lnk{font-size:16px;color:var(--gd);font-weight:600}

.card{margin:12px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.card h3{margin:0 0 10px;font-size:18px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;min-height:48px;padding:12px;font-size:16px;border:1px solid #d5d9de;border-radius:12px;background:#fff;color:var(--ink)}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0}
input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;flex:0 0 auto}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;min-height:50px;padding:12px 16px;font-size:17px;font-weight:700;width:100%;margin-top:14px;display:block}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#eef1f4;color:var(--ink)}
.sm{background:var(--g);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;min-height:40px;width:auto;margin:0}
.sm.ghost{background:#eef1f4;color:var(--ink)}
.del{background:none;border:0;color:var(--red);font-size:20px;min-width:44px;min-height:44px;padding:0}
.chipbar{width:100%;display:flex;gap:10px;margin:2px 0 6px}
.chipbar button{flex:1}

.chips label{margin:0;background:#eef2f7;color:var(--ink);min-height:44px;padding:10px 14px;border-radius:22px;font-size:16px;display:flex;gap:8px;align-items:center}
.prow{display:flex;align-items:center;gap:10px;margin-top:8px}
.prow label.pchk{margin:0;flex:1;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);min-height:44px}
.prow input.pamt{width:130px;min-height:44px}
.ro{font-size:16px;padding:10px 0}
.codebox{margin-top:12px;background:#ecfdf5;border-radius:12px;padding:14px;font-size:16px}
code{font-size:15px;word-break:break-all}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;border:0;background:#fff;color:var(--muted);min-height:60px;padding:6px 2px;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--ink);font-weight:700}
.fab{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;align-items:flex-end;z-index:8}
.fabbtn{border:0;border-radius:30px;padding:0 20px;min-height:52px;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 16px rgba(0,0,0,.2);width:auto;margin:0}
.fabbtn.sc{background:var(--purple)}
.fabbtn.ad{background:var(--g)}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(12px);background:#1f2937;color:#fff;padding:14px 20px;border-radius:14px;font-size:16px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;z-index:20;pointer-events:none;width:max-content;max-width:90vw;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--g)}
#toast.err{background:var(--red)}
#toast.busy{background:#374151}
</style>
</head>
<body>

<div id="toast"></div>

<!-- LOGIN -->
<section id="s-login" class="scr hide">
  <div class="top"><span class="sp"></span><span class="ttl">💸 Split Ledger</span><span class="sp"></span></div>
  <div class="card">
    <h3>Enter your code</h3>
    <label>Your personal code (from the admin)</label>
    <input id="code" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <button class="btn" onclick="login()">Continue</button>
  </div>
</section>

<!-- FRIENDS -->
<section id="s-friends" class="scr hide">
  <div class="top"><span class="sp"></span><span class="ttl">Friends</span><span class="round" onclick="load()" aria-label="Refresh">⟳</span></div>
  <div class="sumline" id="friendsHead"></div>
  <div id="friendsBody"></div>
</section>

<!-- GROUPS -->
<section id="s-groups" class="scr hide">
  <div class="top"><span class="sp"></span><span class="ttl">Groups</span><span class="round" onclick="load()" aria-label="Refresh">⟳</span></div>
  <div id="groupsBody"></div>
</section>

<!-- GROUP -->
<section id="s-group" class="scr hide">
  <div class="hero" id="gHero"></div>
  <div class="sumline" id="gSum"></div>
  <div class="chips2" id="gChips"></div>
  <div id="gBody"></div>
</section>

<!-- EXPENSE DETAIL -->
<section id="s-detail" class="scr hide">
  <div class="top" id="dTop"></div>
  <div id="dBody"></div>
</section>

<!-- ADD / EDIT EXPENSE -->
<section id="s-add" class="scr hide">
  <div class="top">
    <button class="round" onclick="back()" aria-label="Back">‹</button>
    <span class="ttl" id="formTitle">New expense</span>
    <span class="sp"></span>
  </div>
  <div class="form">
    <div id="editBanner" class="editbanner hide"></div>
    <label>Description</label><input id="desc" placeholder="Dinner, fuel, hotel...">
    <label>Amount ($)</label><input id="amt" type="number" inputmode="decimal" step="0.01">
    <label>Date</label><input id="date" type="date">
    <label>Paid by</label>
    <div id="payerBox"></div>
    <label>Category</label>
    <select id="cat">
      <option>General</option><option>Travel</option><option>Food</option>
      <option>Lodging</option><option>Fuel</option><option>Supplies</option>
    </select>
    <label>Receipt photo (optional)</label>
    <input id="receipt" type="file" accept="image/*">
    <div id="receiptNote" class="hint"></div>
    <label id="partLabel">Split between</label>
    <div id="parts" class="chips"></div>
    <button class="btn" id="saveBtn" data-idle="Save expense" onclick="saveExpense(this)">Save expense</button>
  </div>
</section>

<!-- ACTIVITY -->
<section id="s-activity" class="scr hide">
  <div class="top"><span class="sp"></span><span class="ttl">Recent activity</span><span class="round" onclick="load()" aria-label="Refresh">⟳</span></div>
  <div id="activityBody"></div>
</section>

<!-- ACCOUNT -->
<section id="s-account" class="scr hide">
  <div class="top"><span class="sp"></span><span class="ttl">Account</span><span class="sp"></span></div>
  <div id="accBody"></div>
</section>

<div class="fab hide" id="fab">
  <button class="fabbtn sc" onclick="scan()">📷 Scan</button>
  <button class="fabbtn ad" onclick="addNew()">🧾 Add expense</button>
</div>

<nav id="nav">
  <button data-t="friends" onclick="tab('friends')"><span class="ic">👤</span>Friends</button>
  <button data-t="groups" onclick="tab('groups')"><span class="ic">👥</span>Groups</button>
  <button data-t="activity" onclick="tab('activity')"><span class="ic">📊</span>Activity</button>
  <button data-t="account" onclick="tab('account')"><span class="ic">⚙️</span>Account</button>
</nav>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxheRnoxOQ0xR2YB6KIC2_LBtQzb9KNlay1W4Bqdhk7AAAH3DunGvo28EcdKxePmXBMFg/exec';
const APP_URL = 'https://mtgstore.github.io/Split-Ledger-Trips/';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cents = x => Math.round(Number(x) * 100);
const money = c => (c < 0 ? '-' : '') + '$' + (Math.abs(c) / 100).toFixed(2);
const today = () => new Date().toLocaleDateString('en-CA');

const COLORS = ['#e0634a','#2f80ed','#27ae60','#9b51e0','#f2994a','#00a6a6','#c0392b','#16a085','#8e44ad','#d35400'];
const initials = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w.charAt(0)).join('').toUpperCase();
function colorFor(n) { let h = 0; for (const ch of String(n)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
const avatar = n => `<div class="av" style="background:${colorFor(n)}">${esc(initials(n))}</div>`;
const CAT = { General:'🧾', Travel:'✈️', Food:'🍽️', Lodging:'🏨', Fuel:'⛽', Supplies:'🛒', Settlement:'🤝' };
const icon = c => CAT[c] || '🧾';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDay(d) { const p = String(d || '').split('-'); return { m: MON[(+p[1]) - 1] || '', d: +p[2] || '' }; }
const emptyNote = t => `<div class="empty">${esc(t)}</div>`;

let S = { me: null, members: [], trips: [], tripMembers: [], expenses: [], splits: [], payments: [] };
let codeStore = localStorage.getItem('sl_code') || '';
let tripId = localStorage.getItem('sl_trip') || '';
let cur = { view: 'friends' };
let stack = [];
let curTab = 'friends';
let groupTab = 'expenses';
let detailId = null;
let editId = null;
let partSel = null;   // null = everyone on the trip is checked; otherwise a Set of MemberIDs
let payerSel = null;  // admin only: Set of MemberIDs who paid
let payerAmt = {};    // admin only: memberId -> amount typed (string)

// ---------- DATA HELPERS ----------
const nameOf = id => (S.members.find(m => m.MemberID === id) || {}).Name || (id === 'ADMIN' ? 'Admin' : id);
const isAdmin = () => !!(S.me && S.me.admin);
const meId = () => (S.me ? S.me.MemberID : '');
const tripNameOf = (tid = tripId) => (S.trips.find(t => t.TripID === tid) || {}).Name || '';
const tripMems = (tid = tripId) => S.tripMembers.filter(x => x.TripID === tid).map(x => x.MemberID);
const expOf = (tid = tripId) => S.expenses.filter(x => x.TripID === tid);
const paysOf = eid => S.payments.filter(p => p.ExpenseID === eid);
const splitsOf = eid => S.splits.filter(s => s.ExpenseID === eid);
const payersOf = e => { const p = paysOf(e.ExpenseID); return p.length ? p.map(x => ({ id: x.MemberID, c: cents(x.Amount) })) : [{ id: e.PaidBy, c: cents(e.Amount) }]; };
const sharesOf = e => splitsOf(e.ExpenseID).map(s => ({ id: s.MemberID, c: cents(s.Share) }));
const canEdit = e => isAdmin() || (e.EnteredBy === meId() && e.Category !== 'Settlement');
const canDelete = e => isAdmin() || e.EnteredBy === meId();

// Net per person inside one group, in cents. Positive = gets back, negative = owes.
function tripBalances(tid = tripId) {
  const net = {};
  const add = (id, v) => { net[id] = (net[id] || 0) + v; };
  tripMems(tid).forEach(id => add(id, 0));
  expOf(tid).forEach(e => {
    payersOf(e).forEach(p => add(p.id, p.c));
    sharesOf(e).forEach(s => add(s.id, -s.c));
  });
  return net;
}

// Pairwise net with me across every expense that passes the filter.
// Positive = that person owes me. Negative = I owe them.
function pairBalances(filter = () => true) {
  const me = meId(), flow = {};
  S.expenses.filter(filter).forEach(e => {
    const total = cents(e.Amount);
    if (!total) return;
    const pays = payersOf(e), shs = sharesOf(e);
    pays.forEach(p => shs.forEach(s => {
      if (p.id === s.id) return;
      const amt = p.c * s.c / total;
      if (p.id === me) flow[s.id] = (flow[s.id] || 0) + amt;
      else if (s.id === me) flow[p.id] = (flow[p.id] || 0) - amt;
    }));
  });
  const out = {};
  Object.entries(flow).forEach(([id, v]) => { const r = Math.round(v); if (r) out[id] = r; });
  return out;
}

// Greedy settle-up: fewest payments that clear every balance.
function settle(net) {
  const debt = [], cred = [];
  Object.entries(net).forEach(([id, v]) => {
    if (v < 0) debt.push({ id, v: -v });
    if (v > 0) cred.push({ id, v });
  });
  const result = [];
  let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const amt = Math.min(debt[i].v, cred[j].v);
    result.push({ from: debt[i].id, to: cred[j].id, amt });
    debt[i].v -= amt;
    cred[j].v -= amt;
    if (debt[i].v === 0) i++;
    if (cred[j].v === 0) j++;
  }
  return result;
}

// ---------- BANNER + NETWORK ----------
function toast(msg, kind = 'ok', ms = 2500) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show ' + kind;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = ''; }, ms);
}

// Disables the button, shows a busy banner, then success or error.
async function run(btn, busyText, doneText, fn) {
  const oldText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = busyText; }
  toast(busyText, 'busy', 30000);
  try {
    await fn();
    toast(doneText, 'ok');
  } catch (err) {
    toast('Not saved: ' + err.message, 'err', 4500);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = btn.dataset.idle || oldText; }
  }
}

async function api(action, payload) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ code: codeStore, action, ...payload })
  });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

async function load(silent = false) {
  if (!codeStore) { cur = { view: 'login' }; stack = []; draw(); return; }
  if (!silent) toast('Loading…', 'busy', 15000);
  try {
    const r = await fetch(API_URL + '?code=' + encodeURIComponent(codeStore));
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    S = { ...j, payments: j.payments || [] };
    if (!S.trips.find(t => t.TripID === tripId)) tripId = S.trips.length ? S.trips[0].TripID : '';
    localStorage.setItem('sl_trip', tripId);
    if (cur.view === 'login') cur = { view: 'friends' };
    draw();
    if (!silent) toast('Up to date ✓', 'ok', 1500);
  } catch (err) {
    if (String(err.message).includes('Invalid code')) {
      localStorage.removeItem('sl_code');
      codeStore = '';
      cur = { view: 'login' };
      stack = [];
      draw();
    }
    toast('Could not load: ' + err.message, 'err', 4500);
  }
}

function login() {
  codeStore = $('code').value.trim().toUpperCase();
  localStorage.setItem('sl_code', codeStore);
  load();
}

function logout() {
  localStorage.removeItem('sl_code');
  codeStore = '';
  stack = [];
  partSel = null;
  resetForm();
  cur = { view: 'login' };
  draw();
}

// ---------- NAVIGATION ----------
function tab(t) { curTab = t; stack = []; cur = { view: t }; draw(); }
function push(view) { stack.push(cur); cur = { view }; draw(); }
function back() {
  const leaving = cur.view;
  cur = stack.length ? stack.pop() : { view: curTab };
  if (leaving === 'add') resetForm();
  draw();
}

function draw() {
  if (!codeStore) cur = { view: 'login' };
  const v = cur.view;
  document.querySelectorAll('.scr').forEach(s => s.classList.add('hide'));
  $('s-' + v).classList.remove('hide');
  $('nav').classList.toggle('hide', v === 'login' || v === 'add');
  $('fab').classList.toggle('hide', !['friends', 'groups', 'activity', 'group'].includes(v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === curTab));
  if (v === 'friends') renderFriends();
  else if (v === 'groups') renderGroups();
  else if (v === 'activity') renderActivity();
  else if (v === 'group') renderGroup();
  else if (v === 'detail') renderDetail();
  else if (v === 'add') renderAdd();
  else if (v === 'account') renderAccount();
  window.scrollTo(0, 0);
}

function openGroup(tid) {
  tripId = tid;
  localStorage.setItem('sl_trip', tid);
  groupTab = 'expenses';
  push('group');
}

function openDetail(id) {
  detailId = id;
  push('detail');
}

function pickTrip(id) {
  if (editId) resetForm();
  tripId = id;
  partSel = null;
  payerSel = null;
  payerAmt = {};
  localStorage.setItem('sl_trip', id);
  draw();
}

function setGroupTab(k) { groupTab = k; draw(); }

// ---------- RENDER: FRIENDS / GROUPS / ACTIVITY ----------
function balRow(id, v, adminView) {
  const label = adminView
    ? (v > 0 ? 'gets back' : 'owes')
    : (v > 0 ? 'owes you' : 'you owe');
  return `<div class="brow">${avatar(nameOf(id))}<div class="grow"><b>${esc(nameOf(id))}</b></div><div class="right ${v > 0 ? 'g' : 'r'}"><small class="${v > 0 ? 'g' : 'r'}">${label}</small><b>${money(Math.abs(v))}</b></div></div>`;
}

function renderFriends() {
  if (isAdmin()) {
    $('friendsHead').innerHTML = tripId ? `Admin view · <b>${esc(tripNameOf())}</b>` : 'Open a group in Groups first';
    const tb = tripBalances(tripId);
    const ids = Object.keys(tb).filter(id => tb[id] !== 0);
    $('friendsBody').innerHTML = ids.length
      ? ids.map(id => balRow(id, tb[id], true)).join('')
      : emptyNote('Everyone is settled up in this group ✅');
    return;
  }
  const pb = pairBalances();

// Admin: any number of payers with exact amounts. Members: always themselves, full amount.
function renderPayers() {
  const box = $('payerBox');
  if (!isAdmin()) {
    box.innerHTML = `<div class="ro">Paid by <b>${esc(S.me ? S.me.Name : 'you')}</b></div>`;
    return;
  }
  const ids = tripMems();
  if (!payerSel) payerSel = new Set(ids.length ? [ids[0]] : []);
  payerSel = new Set([...payerSel].filter(id => ids.includes(id)));

  const total = cents(parseFloat($('amt').value) || 0);
  if (payerSel.size === 1) {
    const id = [...payerSel][0];
    if (!payerAmt[id] && total > 0) payerAmt[id] = (total / 100).toFixed(2);
  }

  box.innerHTML =
    `<div class="chipbar"><button type="button" class="sm ghost" onclick="splitPayersEvenly()">Split payers evenly</button></div>` +
    ids.map(id => {
      const on = payerSel.has(id);
      return `<div class="prow">
        <label class="pchk"><input type="checkbox" class="pay" value="${esc(id)}" ${on ? 'checked' : ''}>${esc(nameOf(id))}</label>
        <input class="pamt" data-id="${esc(id)}" type="number" inputmode="decimal" step="0.01" placeholder="0.00"
          value="${on ? esc(payerAmt[id] || '') : ''}" ${on ? '' : 'disabled'}>
      </div>`;
    }).join('') + `<div id="payHint" class="hint"></div>`;
  updatePayHint();
}

function payTotals() {
  const total = cents(parseFloat($('amt').value) || 0);
  const paid = payerSel ? [...payerSel].reduce((t, id) => t + cents(parseFloat(payerAmt[id]) || 0), 0) : 0;
  return { total, paid };
}

function updatePayHint() {
  const el = $('payHint');
  if (!el || !isAdmin() || !payerSel) return;
  const { total, paid } = payTotals();
  const diff = total - paid;
  if (!payerSel.size) { el.className = 'hint neg'; el.textContent = 'Pick who paid.'; return; }
  if (total > 0 && diff === 0) {
    el.className = 'hint pos';
    el.textContent = `Paid ${money(paid)} of ${money(total)} ✅`;
  } else if (diff > 0) {
    el.className = 'hint neg';
    el.textContent = `Paid ${money(paid)} of ${money(total)}. ${money(diff)} still unassigned.`;
  } else {
    el.className = 'hint neg';
    el.textContent = `Paid ${money(paid)} of ${money(total)}. ${money(-diff)} too much.`;
  }
}

function splitPayersEvenly() {
  const ids = payerSel ? [...payerSel] : [];
  const total = cents(parseFloat($('amt').value) || 0);
  if (!ids.length || !total) { toast('Pick payers and an amount first', 'err', 3000); return; }
  const base = Math.floor(total / ids.length);
  const extra = total - base * ids.length;
  ids.forEach((id, i) => { payerAmt[id] = ((base + (i < extra ? 1 : 0)) / 100).toFixed(2); });
  renderPayers();
}

function setParts(on) {
  partSel = on ? new Set(tripMems()) : new Set();
  renderAdd();
}

$('parts').addEventListener('change', () => {
  const ids = tripMems();
  partSel = new Set([...document.querySelectorAll('#parts input:checked')].map(i => i.value));
  $('partLabel').textContent = `Split between (${ids.filter(id => partSel.has(id)).length} of ${ids.length} selected)`;
});

$('payerBox').addEventListener('change', e => {
  if (!e.target.classList.contains('pay')) return;
  const id = e.target.value;
  if (!payerSel) payerSel = new Set();
  if (e.target.checked) {
    const total = cents(parseFloat($('amt').value) || 0);
    const others = [...payerSel].reduce((t, o) => t + cents(parseFloat(payerAmt[o]) || 0), 0);
    const left = total - others;
    payerSel.add(id);
    payerAmt[id] = left > 0 ? (left / 100).toFixed(2) : '';
  } else {
    payerSel.delete(id);
  }
  renderPayers();
});

$('payerBox').addEventListener('input', e => {
  if (!e.target.classList.contains('pamt')) return;
  payerAmt[e.target.dataset.id] = e.target.value;
  updatePayHint();
});

$('amt').addEventListener('input', () => {
  if (isAdmin() && payerSel && payerSel.size === 1) {
    const id = [...payerSel][0];
    payerAmt[id] = $('amt').value;
    const inp = document.querySelector(`.pamt[data-id="${id}"]`);
    if (inp) inp.value = $('amt').value;
  }
  updatePayHint();
});

async function saveExpense(btn) {
  const desc = $('desc').value.trim();
  const amt = parseFloat($('amt').value);
  const people = [...document.querySelectorAll('#parts input:checked')].map(i => i.value);
  if (!tripId) { toast('Create or pick a group first', 'err', 4000); return; }
  if (!desc || !(amt > 0) || !people.length) {
    toast('Add a description, an amount, and at least one person', 'err', 4000);
    return;
  }
  const total = cents(amt);

  let payers;
  if (isAdmin()) {
    payers = payerSel
      ? [...payerSel].map(id => ({ memberId: id, amount: cents(parseFloat(payerAmt[id]) || 0) / 100 })).filter(p => p.amount > 0)
      : [];
    if (!payers.length) { toast('Pick who paid', 'err', 4000); return; }
    const paid = payers.reduce((t, p) => t + cents(p.amount), 0);
    if (paid !== total) {
      toast(`Payers add to ${money(paid)} but the total is ${money(total)}`, 'err', 4500);
      return;
    }
  } else {
    payers = [{ memberId: meId(), amount: total / 100 }];
  }

  const base = Math.floor(total / people.length);
  const extra = total - base * people.length;
  const shares = people.map((id, i) => ({ memberId: id, share: (base + (i < extra ? 1 : 0)) / 100 }));

  const editing = !!editId;
  const idToEdit = editId;

  await run(btn, editing ? 'Updating…' : 'Saving…', editing ? 'Expense updated ✅' : 'Expense saved ✅', async () => {
    const f = $('receipt').files[0];
    const receipt = f ? await compress(f) : null;
    const payload = {
      tripId, date: $('date').value || today(), description: desc,
      payers, amount: total / 100,
      category: $('cat').value, shares, receipt
    };
    if (editing) await api('updateExpense', { ...payload, id: idToEdit });
    else await api('addExpense', payload);
    resetForm();
    back();
    await load(true);
  });
}

async function delFromDetail(btn) {
  const id = detailId;
  if (!id) return;
  if (!confirm('Delete this expense?')) return;
  await run(btn, 'Deleting…', 'Expense deleted 🗑️', async () => {
    await api('deleteExpense', { id });
    detailId = null;
    back();
    await load(true);
  });
}

async function settleUp(btn, from, to, amtCents) {
  if (!confirm(`Record ${nameOf(from)} paying ${nameOf(to)} ${money(amtCents)}?`)) return;
  await run(btn, 'Recording…', 'Payment recorded ✅', async () => {
    await api('addExpense', {
      tripId, date: today(),
      description: `Settle: ${nameOf(from)} → ${nameOf(to)}`,
      payers: [{ memberId: from, amount: amtCents / 100 }],
      amount: amtCents / 100, category: 'Settlement',
      shares: [{ memberId: to, share: amtCents / 100 }]
    });
    await load(true);
  });
}

// Shrinks phone photos before upload so they save fast and fit the limit.
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', 0.8).split(',')[1];
      URL.revokeObjectURL(url);
      resolve({ name: (file.name || 'receipt').replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image')); };
    img.src = url;
  });
}

// ---------- ACCOUNT ACTIONS (admin) ----------
async function createTrip(btn) {
  const name = $('tName').value.trim();
  if (!name) { toast('Name the trip first', 'err', 3000); return; }
  const memberIds = [...document.querySelectorAll('.tm:checked')].map(i => i.value);
  await run(btn, 'Creating trip…', 'Trip created ✅', async () => {
    const r = await api('createTrip', { name, type: $('tType').value, startDate: $('tStart').value, memberIds });
    tripId = r.tripId;
    partSel = null;
    payerSel = null;
    await load(true);
  });
}

async function saveRoster(btn) {
  if (!tripId) { toast('Pick a group first', 'err', 3000); return; }
  const memberIds = [...document.querySelectorAll('.rm:checked')].map(i => i.value);
  await run(btn, 'Saving roster…', 'Roster saved ✅', async () => {
    await api('setTripMembers', { tripId, memberIds });
    await load(true);
  });
}

async function addMember(btn) {
  const name = $('mName').value.trim();
  if (!name) { toast('Type a name first', 'err', 3000); return; }
  await run(btn, 'Adding…', 'Member added ✅', async () => {
    const r = await api('createMember', { name });
    await load(true);
    $('newCode').innerHTML = `<div class="codebox">${esc(name)}'s code: <b>${esc(r.code)}</b><br><small>Copy it from the member list below.</small></div>`;
  });
}

function inviteText(m) {
  return `Hi ${m.Name}, you're invited to ${tripNameOf()} on Split Ledger.\nOpen: ${APP_URL}\nYour code: ${m.Code}`;
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
}

async function copyInvite(btn) {
  const m = S.members.find(x => x.MemberID === btn.dataset.id);
  if (!m || !m.Code) { toast('No code for this person', 'err', 3000); return; }
  await copyToClipboard(inviteText(m));
  toast('Copied for ' + m.Name + ' ✅', 'ok', 2000);
}
